  adx_period: 14
  min_adx_mean: 18.0
  min_trend_ratio: 0.30
  min_bull_alignment: 0.35
  max_ma_crossings_year: 6.0
  min_efficiency: 0.04
  min_price_range: 0.40
  min_max_bull_streak: 150
