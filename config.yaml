global_setting:
  initial_capital: 110000.0
  start_date: '20240101'
  end_date: '20260921'
  slippage_perc: 0.0
stock_blacklist: []
commission_config:
  commission: 0.00025
  stamp_duty: 0.001
  transfer_fee: 0.00001
opt_pipeline:
  out_sample_train_end: '2024-12-31'
  out_sample_overfit_threshold: 0.15
  rolling_start_year: 2020
  rolling_train_years: 4
  rolling_test_years: 1
  rolling_min_train_bars: 200
  rolling_min_test_bars: 100
  optimize_metric: profit_rate
stock_filter:
  # Pairlist Filters（概念对齐 freqtrade；turnover/liquidity 为 A 股扩展，无 freqtrade 对应内建过滤器）
  pairlist:
    age_filter:              # AgeFilter：窗口内最少交易日数（指标预热）
      min_days_listed: 120
    price_filter:            # PriceFilter：均价下限（剔除仙股/退市风险价区）
      low_price: 1.0
    volume_filter:           # VolumeFilter：日均成交额流动性下限
      lookback_days: 0       #   0=全窗口评估；>0 仅看最近 N 个交易日
      min_avg_amount_yi: 0.5
    turnover_filter:         # A 股扩展：日均换手率下限（%）
      min_avg_turn: 0.2
    liquidity_filter:        # A 股扩展：零成交占比 / 最长停牌日历日缺口
      max_zero_volume_ratio: 0.01
      max_gap_days: 20
  trend:
    adx_period: 14
    min_adx_mean: 18.0
    min_trend_ratio: 0.3
    min_bull_alignment: 0.35
    max_ma_crossings_year: 6.0
    min_efficiency: 0.04
    min_price_range: 0.4
    min_max_bull_streak: 150
  regime:
    breakout_min_range: 0.8
    breakout_min_adx: 22.0
    trend_min_adx: 22.0
    trend_min_efficiency: 0.04
    trend_min_bull_streak: 150
    range_max_adx: 22.0
    range_max_efficiency: 0.035
